name: Raspberry Pi CI

on:
  pull_request:
    paths:
      - "raspberrypi/**"
      - ".github/workflows/raspberrypi-ci.yml"
  push:
    branches: [main]
    paths:
      - "raspberrypi/**"
      - ".github/workflows/raspberrypi-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raspberrypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: raspberrypi/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Type-check
        run: npm run build
